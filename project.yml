name: WhisperPolish
options:
  bundleIdPrefix: com.jonclegg
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.15.5
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    exactVersion: 0.18.0
targets:
  WhisperPolish:
    type: application
    platform: iOS
    info:
      path: build/WhisperPolish-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: "Whisper Polish records audio to transcribe your voice notes on-device."
        WhisperPolishCloudAPIBaseURL: "$(WHISPER_POLISH_API_BASE_URL)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    sources:
      - WhisperPolish
    dependencies:
      - package: FluidAudio
      - package: WhisperKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.jonclegg.WhisperPolish
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.10"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 22CTWHGWQQ
        WHISPER_POLISH_API_BASE_URL: "https://api.whisper-polish.yallware.com"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  WhisperPolishTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: WhisperPolish
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.10"
schemes:
  WhisperPolish:
    build:
      targets:
        WhisperPolish: all
        WhisperPolishTests: [test]
    run:
      config: Debug
      storeKitConfiguration: WhisperPolish.storekit
    test:
      config: Debug
      targets:
        - WhisperPolishTests
